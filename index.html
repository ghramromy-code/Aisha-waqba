<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبادرة عالم العلوم - ابتدائية الوقبة</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(180deg, #1A0B2E 0%, #2D1B4E 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* أنميشن العناصر الطائرة */
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.8); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        .floating-icon {
            position: fixed;
            z-index: 0;
            font-size: 32px;
            pointer-events: none;
            animation: float 10s linear infinite;
        }

        .icon1 { left: 8%; animation-duration: 8s; animation-delay: 0s; }
        .icon2 { left: 25%; animation-duration: 12s; animation-delay: 2s; font-size: 40px; }
        .icon3 { left: 48%; animation-duration: 9s; animation-delay: 4s; }
        .icon4 { left: 70%; animation-duration: 11s; animation-delay: 1s; font-size: 36px; }
        .icon5 { left: 88%; animation-duration: 10s; animation-delay: 3s; }

        /* كارت المحتوى */
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1;
            text-align: center;
        }

        /* الهيدر */
        .header-box {
            background: linear-gradient(135deg, #FF6B9B 0%, #C850C0 50%, #4158D0 100%);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .header-title { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .header-sub { font-size: 18px; color: #FFE500; font-weight: bold; margin-bottom: 8px; }
        .header-teacher { font-size: 14px; opacity: 0.9; line-height: 1.4; }

        /* المدخلات والأزرار */
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #FF6B9B;
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 16px;
            text-align: center;
            margin: 15px 0 20px 0;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(90deg, #FF4081 0%, #FF6B9B 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
            transition: transform 0.2s, background 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover { transform: scale(1.02); }

        .grid-levels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn.selected {
            background: #FF4081;
            border-color: white;
        }

        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }
        .alert-success { background: #4CAF50; color: white; }
        .alert-error { background: #f44336; color: white; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- الأشكال المتحركة -->
    <div class="floating-icon icon1">🦋</div>
    <div class="floating-icon icon2">🌸</div>
    <div class="floating-icon icon3">🐰</div>
    <div class="floating-icon icon4">🌿</div>
    <div class="floating-icon icon5">🐥</div>

    <div class="container">
        <!-- الهيدر الثابت -->
        <div class="header-box">
            <div class="header-title">ابتدائية الوقبة</div>
            <div class="header-sub">مبادرة عالم العلوم 🌿</div>
            <div class="header-teacher">إعداد وتجميع: أ. عائشة العمر</div>
            <div class="header-teacher">مديرة المدرسة: أ. سالمة العمري</div>
        </div>

        <!-- الشاشة 1: إدخال الاسم -->
        <div id="screen-name">
            <h3 style="margin-bottom: 10px;">🌸 أهلاً بكِ يا بطلة المستقبل 🌸</h3>
            <p style="font-size: 14px; opacity: 0.8;">أدخلي اسمكِ الثلاثي المبدع للبدء:</p>
            <input type="text" id="student-name" placeholder="الاسم الثلاثي...">
            <button class="btn" onclick="startQuiz()">ابدأي المغامرة 🚀</button>
        </div>

        <!-- الشاشة 2: اختيار المستوى -->
        <div id="screen-levels" class="hidden">
            <h3 id="welcome-msg" style="margin-bottom: 15px;"></h3>
            <p style="margin-bottom: 15px;">اختاري مستواكِ وابدأي التحدي! 🎒</p>
            <div class="grid-levels">
                <button class="btn" onclick="selectLevel(1)">المستوى الأول 🌸</button>
                <button class="btn" onclick="selectLevel(2)">المستوى الثاني 🌺</button>
                <button class="btn" onclick="selectLevel(3)">المستوى الثالث 🌿</button>
                <button class="btn" onclick="selectLevel(4)">المستوى الرابع 🦋</button>
                <button class="btn" onclick="selectLevel(5)">المستوى الخامس 👑</button>
                <button class="btn" onclick="selectLevel(6)">المستوى السادس 🏆</button>
            </div>
        </div>

        <!-- الشاشة 3: الأسئلة -->
        <div id="screen-quiz" class="hidden">
            <h4 id="quiz-title" style="color: #FFE500; margin-bottom: 15px;"></h4>
            <div id="question-text" style="font-size: 18px; margin-bottom: 15px; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px;"></div>
            <div class="options-container" id="options-box"></div>
            <button class="btn" onclick="submitAnswer()">إرسال الإجابة 🎯</button>
            <div id="feedback" class="alert"></div>
        </div>

        <!-- الشاشة 4: النهاية -->
        <div id="screen-end" class="hidden">
            <h2>🏆 أبدعتِ يا بطلة!</h2>
            <p style="margin: 20px 0; font-size: 18px;">أكملتِ الاختبار بنجاح متألق! 🎉</p>
            <button class="btn" onclick="resetToLevels()">العودة للمستويات ➡️</button>
        </div>
    </div>

    <script>
        const questionsDB = {
            1: [
                { q: "أي مما يلي يُعتبر من الكائنات الحية؟", options: ["الحجر", "النبات", "السيارة"], answer: "النبات" },
                { q: "ماذا تحتاج النبتة الجميلة لتصنع غذاءها؟", options: ["ضوء الشمس والماء", "الحليب والعصير", "الألعاب"], answer: "ضوء الشمس والماء" },
                { q: "الجزء الذي يمتص الماء من التربة هو:", options: ["الأوراق", "الأزهار", "الجذور"], answer: "الجذور" }
            ],
            2: [
                { q: "الحيوانات التي تأكل الأعشاب والنباتات فقط تسمى:", options: ["أكلات لحوم", "أكلات أعشاب", "قارضة"], answer: "أكلات أعشاب" }
            ]
        };

        let studentName = "";
        let currentLevel = 1;
        let currentQIndex = 0;
        let selectedOption = null;

        function startQuiz() {
            const input = document.getElementById('student-name').value;
            if(!input.trim()) return alert('لطفاً أدخلي اسمك أولاً!');
            studentName = input;
            document.getElementById('welcome-msg').innerText = `أهلاً بكِ يا فراشة العلوم: ${studentName} 🦋`;
            showScreen('screen-levels');
        }

        function selectLevel(level) {
            if(!questionsDB[level]) {
                alert('هذا المستوى سيتم فتحه قريباً!');
                return;
            }
            currentLevel = level;
            currentQIndex = 0;
            loadQuestion();
            showScreen('screen-quiz');
        }

        function loadQuestion() {
            selectedOption = null;
            document.getElementById('feedback').style.display = 'none';
            const qData = questionsDB[currentLevel][currentQIndex];
            document.getElementById('quiz-title').innerText = `المستوى ${currentLevel} — السؤال (${currentQIndex + 1}/${questionsDB[currentLevel].length})`;
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsBox = document.getElementById('options-box');
            optionsBox.innerHTML = '';
            qData.options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedOption = opt;
                };
                optionsBox.appendChild(btn);
            });
        }

        function submitAnswer() {
            if(!selectedOption) return alert('اختاري إجابة أولاً!');
            const qData = questionsDB[currentLevel][currentQIndex];
            const feedback = document.getElementById('feedback');
            
            feedback.style.display = 'block';
            if(selectedOption === qData.answer) {
                feedback.className = 'alert alert-success';
                feedback.innerText = 'إجابة صحيحة وممتازة! أحسنتِ يا مبدعة! 🎉';
                setTimeout(() => {
                    currentQIndex++;
                    if(currentQIndex < questionsDB[currentLevel].length) {
                        loadQuestion();
                    } else {
                        showScreen('screen-end');
                    }
                }, 1500);
            } else {
                feedback.className = 'alert alert-error';
                feedback.innerText = `حاولي مرة أخرى! الإجابة الصحيحة هي: ${qData.answer}`;
            }
        }

        function resetToLevels() {
            showScreen('screen-levels');
        }

        function showScreen(screenId) {
            ['screen-name', 'screen-levels', 'screen-quiz', 'screen-end'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }
    </script>
</body>
</html>
